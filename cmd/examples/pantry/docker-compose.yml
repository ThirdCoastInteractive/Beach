name: pantry

# Standalone runner for the pantry example (CRUD / apigen / auth / analytics).
#
#   cp .env.example .env           # then edit it (the passwords)
#   docker compose up --build      →  http://localhost:8080   (admin / password)
#
# Postgres (system of record: inventory, auth, sessions) and ClickHouse (the
# dashboard's activity firehose) are required; both are internal-only (no host
# port mapping), only the app is published. Connection strings are built here
# from the credentials in .env and the service names. The image is built from
# the repo root via the shared Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beach}
      POSTGRES_DB: ${POSTGRES_DB:-pantry}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beach} -d ${POSTGRES_DB:-pantry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-beach}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-beach}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pantry}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [chdata:/var/lib/clickhouse]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pantry:
    build:
      context: ../../..
      args: { APP: cmd/examples/pantry }
    environment:
      PORT: "8080"
      # Reached by service name on the internal network; never published to host.
      DATABASE_URL: postgres://${POSTGRES_USER:-beach}:${POSTGRES_PASSWORD:-beach}@postgres:5432/${POSTGRES_DB:-pantry}?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-beach}:${CLICKHOUSE_PASSWORD:-beach}@clickhouse:9000/${CLICKHOUSE_DB:-pantry}
    networks: [internal]
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

networks:
  internal: { driver: bridge }

volumes:
  pgdata:
  chdata:
