<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>LOTOPHAGES — the Order of the Lotus-Eaters</title>
<meta name="description" content="An order of the sun. They ate the lotus and did not return. ἥλιος · λωτός · λόγος — a cyanotype rite." />
<meta name="theme-color" content="#143a86" />
<meta property="og:title" content="LOTOPHAGES" />
<meta property="og:description" content="The Order of the Lotus-Eaters. They ate, and did not return. ἥλιος · λωτός · λόγος." />
<meta property="og:type" content="website" />
<meta property="og:image" content="og.svg" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- coated paper: cyanotype wash + grain -->
<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="none">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="4" stitchTiles="stitch" />
    <feComponentTransfer><feFuncA type="linear" slope="0.12" intercept="0" /></feComponentTransfer>
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.011" numOctaves="2" seed="9" stitchTiles="stitch" />
    <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0" /></feComponentTransfer>
  </filter>
  <rect class="cloud-rect" width="100%" height="100%" filter="url(#cloud)" />
  <rect class="paper-rect" width="100%" height="100%" filter="url(#paper)" />
</svg>

<!-- the ruled frame of the plate -->
<div class="frame" aria-hidden="true"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>

<main class="plate develop">

  <header class="reg top">
    <span class="mark">The Order of the Lotus</span>
    <span class="mark">Rite XVII &middot; MMXXVI</span>
  </header>

  <!-- the emblem: hard geometry, a stippled lotus, a gold sun -->
  <figure class="emblem" role="img" aria-label="A cyanotype emblem: a white stippled lotus rising within a square and triangle, beneath a gold sun.">
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- irregular white stipple dots, seamless across tiles -->
        <filter id="stippleDots" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="8" stitchTiles="stitch" result="t" />
          <feColorMatrix in="t" type="matrix"
            values="0 0 0 0 0.93
                    0 0 0 0 0.96
                    0 0 0 0 0.99
                    0 0 0 9 -3.9" />
        </filter>
        <filter id="starDots" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="1" seed="2" result="t" />
          <feColorMatrix in="t" type="matrix"
            values="0 0 0 0 0.95
                    0 0 0 0 0.98
                    0 0 0 0 1
                    0 0 0 12 -5.6" />
        </filter>
        <pattern id="stip" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
          <rect width="120" height="120" filter="url(#stippleDots)" />
        </pattern>

        <linearGradient id="lotusShade" x1="500" y1="232" x2="500" y2="772" gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#eef5f9" stop-opacity="0.8" />
          <stop offset="48%" stop-color="#bcdcef" stop-opacity="0.26" />
          <stop offset="100%" stop-color="#5e93c4" stop-opacity="0.40" />
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f0d479" />
          <stop offset="62%" stop-color="#d8b24c" />
          <stop offset="100%" stop-color="#bd9636" />
        </radialGradient>
        <radialGradient id="starFade" cx="50%" cy="40%" r="58%">
          <stop offset="0%" stop-color="#fff" />
          <stop offset="100%" stop-color="#000" />
        </radialGradient>
        <mask id="starMask"><rect x="80" y="90" width="840" height="520" fill="url(#starFade)" /></mask>

        <!-- one lancet petal, pointing up from the centre -->
        <path id="petal" d="M500 500 C452 426 456 318 500 240 C544 318 548 426 500 500 Z" />

        <!-- the lotus, three concentric rows -->
        <g id="lotus">
          <g class="row-outer">
            <use href="#petal" transform="rotate(0 500 500)"/><use href="#petal" transform="rotate(30 500 500)"/>
            <use href="#petal" transform="rotate(60 500 500)"/><use href="#petal" transform="rotate(90 500 500)"/>
            <use href="#petal" transform="rotate(120 500 500)"/><use href="#petal" transform="rotate(150 500 500)"/>
            <use href="#petal" transform="rotate(180 500 500)"/><use href="#petal" transform="rotate(210 500 500)"/>
            <use href="#petal" transform="rotate(240 500 500)"/><use href="#petal" transform="rotate(270 500 500)"/>
            <use href="#petal" transform="rotate(300 500 500)"/><use href="#petal" transform="rotate(330 500 500)"/>
          </g>
          <g class="row-mid">
            <use href="#petal" transform="rotate(15 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(45 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(75 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(105 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(135 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(165 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(195 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(225 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(255 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(285 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(315 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(345 500 500) translate(500 500) scale(0.74) translate(-500 -500)"/>
          </g>
          <g class="row-front">
            <use href="#petal" transform="rotate(0 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(45 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(90 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(135 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(180 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(225 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(270 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
            <use href="#petal" transform="rotate(315 500 500) translate(500 500) scale(0.46) translate(-500 -500)"/>
          </g>
        </g>
      </defs>

      <!-- straight-edged geometry: octagram, triangle, baseline -->
      <g class="geo-faint">
        <rect x="178" y="160" width="644" height="644" />
        <rect x="178" y="160" width="644" height="644" transform="rotate(45 500 482)" />
      </g>
      <g class="geo">
        <path d="M500 140 L820 740 L180 740 Z" />
        <line x1="128" y1="740" x2="872" y2="740" />
        <line x1="128" y1="768" x2="872" y2="768" />
      </g>

      <!-- starfield around the sun, feathered -->
      <rect class="stars" x="80" y="90" width="840" height="520" filter="url(#starDots)" mask="url(#starMask)" />

      <!-- the gold sun -->
      <circle class="sun" cx="500" cy="196" r="60" fill="url(#sun)" />

      <!-- the lotus: luminous shade, stipple body, white line -->
      <use href="#lotus" class="lotus-shade" />
      <use href="#lotus" class="lotus-stip" />
      <use href="#lotus" class="lotus-line" />

      <!-- the stamen boss -->
      <g class="boss">
        <circle cx="500" cy="500" r="42" class="boss-disk" />
        <circle cx="500" cy="500" r="42" class="boss-ring" />
        <g class="seeds">
          <circle cx="500" cy="468" r="3.2"/><circle cx="523" cy="477" r="3.2"/><circle cx="532" cy="500" r="3.2"/>
          <circle cx="523" cy="523" r="3.2"/><circle cx="500" cy="532" r="3.2"/><circle cx="477" cy="523" r="3.2"/>
          <circle cx="468" cy="500" r="3.2"/><circle cx="477" cy="477" r="3.2"/><circle cx="500" cy="500" r="3.6"/>
        </g>
      </g>
    </svg>
  </figure>

  <h1 class="wordmark">Lotophages</h1>
  <p class="order">The Order of the Lotus-Eaters</p>
  <p class="triad">ἥλιος&nbsp;&middot;&nbsp;λωτός&nbsp;&middot;&nbsp;λόγος</p>

  <hr class="rule" />

  <p class="aphorism" id="aphorism">They ate the lotus, and did not return.</p>

  <form class="petition" id="summon" novalidate>
    <label for="email" class="petition-label">Petition the order &middot; the roll opens at solstice</label>
    <div class="petition-row">
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="the name you will forget" aria-label="Email address" required />
      <button type="submit">Petition</button>
    </div>
    <p class="petition-note" id="summon-note" role="status" aria-live="polite"></p>
  </form>

  <footer class="reg bot">
    <span class="mark">Secretum &middot; Ordinis &middot; Loti</span>
    <span class="mark">Folio ΛΩ&middot;VII</span>
  </footer>

</main>

<script src="app.js" defer></script>
</body>
</html>
