name: hush

# Self-contained hush stack: the app, its Postgres, and its ClickHouse — only
# the web port is published; the databases are internal-only.
#
#   cp .env.docker.example .env             # then edit it (mail keys, secrets)
#   docker compose build --ssh default      # Repute is a private module, see below
#   docker compose up                       →  http://localhost:8080  (admin / password)
#
# The .env (from .env.docker.example) holds only the Postgres credentials, the
# operator secrets (mail, R2, Cloudflare), and the policy seeds. It carries NO
# DATABASE_URL or CLICKHOUSE_DSN: the app reaches its database and observation
# store by SERVICE name, and this file builds those connection strings from the
# credentials below and the service names — so the database connection is
# configured in exactly one place, here, not duplicated into the .env.
#
# NOTE: hush depends on the private module github.com/ThirdCoastInteractive/Repute,
# so the image build needs git access to it. Build with BuildKit SSH forwarding —
# `docker compose build --ssh default` — and the shared Dockerfile forwards the
# agent + GOPRIVATE to `go mod download`. (The other three examples build with no
# extra flags.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beach}
      POSTGRES_DB: ${POSTGRES_DB:-hush}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beach} -d ${POSTGRES_DB:-hush}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The observation store behind /admin/analytics. Internal-only, like
  # postgres; drop this service (and CLICKHOUSE_DSN below) and the app runs
  # with analytics off.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: hush
      # The image ships `default` locked to container-localhost; this makes the
      # entrypoint regenerate that user with open networks so the app can reach
      # it across the (internal-only) compose network by service name.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [chdata:/var/lib/clickhouse]
    networks: [internal]
    healthcheck:
      # clickhouse-client talks to its own server over the native protocol —
      # no host or port to name, so the check never depends on how localhost
      # happens to resolve.
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  hush:
    build:
      context: ../..
      args:
        APP: hush
        GOPRIVATE: github.com/ThirdCoastInteractive
      ssh: [default] # forward the SSH agent so go can fetch the private Repute module
    # The operator's config — credentials, mail, R2, Cloudflare Images, the
    # policy seeds — rides in from .env (copied from .env.docker.example).
    env_file: [.env]
    # The connection strings are built here, from the credentials and the
    # service names, so they live in one place and never localhost. HUSH_BASE_URL
    # takes the .env value when set (your public origin), else a localhost
    # default for a kick-the-tires run.
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-beach}:${POSTGRES_PASSWORD:-beach}@postgres:5432/${POSTGRES_DB:-hush}?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://default:@clickhouse:9000/hush
      HUSH_BASE_URL: ${HUSH_BASE_URL:-http://localhost:8080}
    networks: [internal]
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

networks:
  internal: { driver: bridge }

volumes:
  pgdata:
  chdata:

