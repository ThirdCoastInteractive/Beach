name: the-beach

# Postgres + ClickHouse and the three example apps. The databases are reachable
# only on the internal compose network (no `ports:` → no host publishing), so
# nothing maps a DB port to the host. Only the apps publish ports.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beach
      POSTGRES_PASSWORD: beach
      POSTGRES_DB: pantry
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beach -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: in-network only.

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: beach
      CLICKHOUSE_PASSWORD: beach
      CLICKHOUSE_DB: beach
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: in-network only.

  boardwalk:
    build:
      context: .
      args: { APP: boardwalk }
    networks: [internal]
    ports: ["8081:8080"] # in-memory game, no DB
    restart: unless-stopped

  driftbottle:
    build:
      context: .
      args: { APP: driftbottle }
    networks: [internal]
    ports: ["8082:8080"] # ephemeral chat, no DB
    restart: unless-stopped

  pantry:
    build:
      context: .
      args: { APP: pantry }
    environment:
      # Reached by service name on the internal network; never published to host.
      DATABASE_URL: postgres://beach:beach@postgres:5432/pantry?sslmode=disable
      CLICKHOUSE_DSN: clickhouse://beach:beach@clickhouse:9000/beach
    networks: [internal]
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  chdata:
